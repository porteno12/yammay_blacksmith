<!DOCTYPE html>
<html lang="he" dir="rtl" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>לוח בקרה - Artisan Iron</title>
</head>
<body>
    <div layout:fragment="content">
        <section class="admin-dashboard" style="padding: var(--space-section) 0;">
            <div class="container">
                <h1 style="font-size: 2.5rem; margin-bottom: 2rem; color: var(--color-primary);">לוח בקרה</h1>

                <div class="admin-actions">
                    <a th:href="@{/admin/products}" class="btn btn-outline">ניהול מוצרים</a>
                    <a th:href="@{/admin/submissions}" class="btn btn-outline">צור קשר והבקשות</a>
                    <a th:href="@{/admin/logout}" class="btn btn-outline">התנתקות</a>
                </div>

                <div class="admin-stats">
                    <div class="admin-stat-card">
                        <h2>הודעות</h2>
                        <p class="stat-count" th:text="${unreadMessages} ?: 0"></p>
                        <p class="stat-label">הודעות שלא נקראו</p>
                        <a th:href="@{/admin/submissions}" class="btn btn-small">צפה הכל</a>
                    </div>

                    <div class="admin-stat-card">
                        <h2>בקשות</h2>
                        <p class="stat-count" th:text="${unreadInquiries} ?: 0"></p>
                        <p class="stat-label">בקשות שלא נקראו</p>
                        <a th:href="@{/admin/submissions}" class="btn btn-small">צפה הכל</a>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
