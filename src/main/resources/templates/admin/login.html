<!DOCTYPE html>
<html lang="he" dir="rtl" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>כניסת מנהל - Yammay Blacksmith</title>
</head>
<body>
    <div layout:fragment="content">
        <section class="admin-login" style="padding: 80px 0;">
            <div class="container">
                <h1 style="font-size: 2rem; color: #3E2723; margin-bottom: 2rem; text-align: center;">כניסת מנהל</h1>

                <div th:if="${param.error}" style="background: #FFEBEE; color: #C62828; padding: 1rem; border-radius: 4px; max-width: 400px; margin: 0 auto 1.5rem;">
                    שם משתמש או סיסמה שגויים
                </div>
                <div th:if="${param.logout}" style="background: #E8F5E9; color: #2E7D32; padding: 1rem; border-radius: 4px; max-width: 400px; margin: 0 auto 1.5rem;">
                    התנתקת בהצלחה
                </div>

                <form th:action="@{/admin/login}" method="post" class="form" style="max-width: 400px; margin: 0 auto;">
                    <div class="form-group">
                        <label for="username">שם משתמש</label>
                        <input type="text" id="username" name="username" class="form-input" required autofocus>
                    </div>
                    <div class="form-group">
                        <label for="password">סיסמה</label>
                        <input type="password" id="password" name="password" class="form-input" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-large" style="width: 100%;">כניסה</button>
                </form>
            </div>
        </section>
    </div>
</body>
</html>
