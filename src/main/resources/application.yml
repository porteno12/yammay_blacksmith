spring:
  application:
    name: artisan-iron-web
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

firebase:
  database-url: ${FIREBASE_DATABASE_URL:}
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}

admin:
  password: ${ADMIN_PASSWORD:admin123}
  thymeleaf:
    cache: false
    mode: HTML
  mail:
    host: smtp.sendgrid.net
    port: 587
    username: apikey
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100,expireAfterWrite=10m

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.artisaniron: DEBUG
    com.google.firebase: DEBUG
