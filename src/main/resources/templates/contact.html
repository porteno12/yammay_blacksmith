<!DOCTYPE html>
<html lang="he" dir="rtl" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>צור קשר - Artisan Iron</title>
</head>
<body>
    <div layout:fragment="content">
        <section class="contact-page">
            <div class="container">
                <h1>צור קשר</h1>

                <div class="contact-content">
                    <div class="contact-form-section">
                        <h2>שלח לנו הודעה</h2>
                        <form th:action="@{/contact}" method="post" th:object="${contactForm}" class="form">
                            <div class="form-group">
                                <label for="senderName">שם</label>
                                <input type="text" id="senderName" th:field="*{senderName}" class="form-input" required>
                                <span th:if="${#fields.hasErrors('senderName')}" th:errors="*{senderName}" class="error"></span>
                            </div>

                            <div class="form-group">
                                <label for="email">דוא״ל</label>
                                <input type="email" id="email" th:field="*{email}" class="form-input" required>
                                <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error"></span>
                            </div>

                            <div class="form-group">
                                <label for="phone">טלפון</label>
                                <input type="tel" id="phone" th:field="*{phone}" class="form-input">
                                <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="error"></span>
                            </div>

                            <div class="form-group">
                                <label for="message">הודעה</label>
                                <textarea id="message" th:field="*{message}" class="form-textarea" rows="5" required></textarea>
                                <span th:if="${#fields.hasErrors('message')}" th:errors="*{message}" class="error"></span>
                            </div>

                            <button type="submit" class="btn btn-primary">שלח הודעה</button>
                        </form>
                    </div>

                    <div class="contact-info-section">
                        <h2>פרטי קשר</h2>
                        <div class="info-item">
                            <h3>טלפון</h3>
                            <a href="tel:+15550198">+1 555-0198</a>
                        </div>
                        <div class="info-item">
                            <h3>דוא״ל</h3>
                            <a href="mailto:forge@artisaniron.com">forge@artisaniron.com</a>
                        </div>
                        <div class="info-item">
                            <h3>שעות פעילות</h3>
                            <p>שני עד שישי: 9:00 - 18:00</p>
                            <p>שישי וחגים: בהודעה מוקדמת</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
